# === Multiplayer Hardcore Lite ===
# Your server's PRIMARY world (level-name in server.properties, usually "world")
# is used ONLY as a holding area during resets and is never played in.
# The gameplay world set below MUST have a different name than level-name.

# Base name for the gameplay world set: <name>, <name>_nether, <name>_the_end
gameplay-world: hardcore

# Generate + reset a Nether and End alongside the overworld.
enable-nether: true
enable-end: true

# Seconds between the fatal Death (0 max hearts) and the wipe.
countdown-seconds: 5

# World border radius in blocks. 0 = NO border (default). Larger = bigger area but
# slower resets, since more explored terrain must be deleted.
world-border-radius: 0

# Wipe inventories, armor and XP when the world resets.
# Clean players (no Death stacks) still get their keep-items-count picks back.
clear-inventory-on-reset: true

# Ender chest contents persist across world resets by default (a shared
# stash that survives the apocalypse). Set true to wipe them too.
clear-ender-chest-on-reset: false

# Each death grants that player a timed "Death" stack: −hearts from max HP
# for death-duration-hours of REAL-WORLD / wall-clock time (continues while
# the server is offline or the player is logged out — not Minecraft day length).
# Stacks expire independently and only affect the player who died. At 0 max
# hearts the world resets. Default: −2 hearts for 48 real hours; the 5th
# active stack resets the world for that player.
hearts-per-death-stack: 2
death-duration-hours: 48

# How many items/stacks each player may carry from their old inventory into
# the next world after a reset. 0 disables the selection entirely.
# Players with any active Death stack at wipe time do not get picks.
keep-items-count: 3

# --- managed automatically; don't edit ---
attempts: 0
deaths: 0
