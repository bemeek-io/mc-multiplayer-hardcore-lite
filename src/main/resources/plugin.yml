name: MultiplayerHardcoreLite
version: '${version}'
main: com.evensteven.mhplus.MHPlus
api-version: '26.2'
description: Each death grants a timed Death stack that cuts that player's max health; at zero the world resets. Clean players may pick items to carry over.
authors: [you]
commands:
  mhreset:
    description: Force a world reset now, optionally with a seed (number or word).
    usage: /mhreset [seed]
    permission: mhplus.reset
  mhstatus:
    description: Show the current run's attempt, deaths, and your Death stacks / max health.
    usage: /mhstatus
  mhkeep:
    description: Reopen your pending "choose items to keep" menu after a world reset.
    usage: /mhkeep
permissions:
  mhplus.reset:
    description: Allows forcing a manual world reset.
    default: op
