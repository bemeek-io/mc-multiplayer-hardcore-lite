name: MultiplayerHardcoreLite
version: '${version}'
main: com.evensteven.mhplus.MHPlus
api-version: '26.2'
description: Every death drains the team's max health and buffs mobs; at zero the world resets and players pick a few items to carry over.
authors: [you]
commands:
  mhreset:
    description: Force a world reset now, optionally with a seed (number or word).
    usage: /mhreset [seed]
    permission: mhplus.reset
  mhstatus:
    description: Show the current run's attempt, deaths, remaining max health and mob strength.
    usage: /mhstatus
  mhkeep:
    description: Reopen your pending "choose items to keep" menu after a world reset.
    usage: /mhkeep
permissions:
  mhplus.reset:
    description: Allows forcing a manual world reset.
    default: op
